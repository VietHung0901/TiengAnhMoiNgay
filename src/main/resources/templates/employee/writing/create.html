<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Create Writing Lesson</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{partial/employee_header :: employee_header}"></th:block>
<th:block th:replace="~{partial/employee_sidebar :: employee_sidebar}"></th:block>

<main id="main" class="main">
    <div class="pagetitle">
        <h1>Listening</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item active"><a href="/view/admin/writing/list/1">List</a></li>
                <li class="breadcrumb-item active"><a href="/view/admin/writing/create">Create</a></li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <th:block th:replace="~{partial/notify :: notify}"></th:block>
    <th:block th:replace="~{partial/loading :: loading}"></th:block>

    <section class="section dashboard">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Create Writing Lesson</h5>

                <!-- Vertical Form -->
                <form id="createWritingForm" class="row g-3">
                    <div class="col-12">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title">
                        <div class="invalid-feedback">Enter a valid title!</div>
                    </div>

                    <div class="col-12">
                        <label for="level" class="form-label">Level</label>
                        <select class="form-select" id="level" required>
                            <option value="1">Beginner</option>
                            <option value="2">Intermediate</option>
                            <option value="3">Advanced</option>
                        </select>
                        <div class="invalid-feedback">Please select a valid level!</div>
                    </div>

                    <!-- Preview file word -->
                    <div class="col-12">
                        <label for="file" class="form-label">File</label>
                        <input type="file" class="form-control" id="file"
                               accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                        <div class="invalid-feedback">Please upload a Word document (.docx)!</div>
                    </div>
                    <div class="col-12 mt-3">
                        <label class="form-label">Preview</label>
                        <div id="preview" style="border: 1px solid #ccc; padding: 10px; min-height: 150px; background: #f9f9f9;"></div>
                    </div>
                    <!-- Preview file word -->

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form><!-- Vertical Form -->

            </div>
        </div>
    </section>
</main><!-- End #main -->

<th:block th:replace="~{partial/employee_footer :: employee_footer}"></th:block>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

<!-- Script for Create -->
<script th:src="@{/js/writing/create.js}"></script>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>

<!-- <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>
<!-- Preview file word-->
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
</body>

</html>
