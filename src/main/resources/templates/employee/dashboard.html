<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Dashboard</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">


    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{partial/employee_header :: employee_header}"></th:block>
<th:block th:replace="~{partial/employee_sidebar :: employee_sidebar}"></th:block>

<main id="main" class="main">
    <div class="pagetitle">
        <h1>Dashboard</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item active"><a href="/view/admin/dashboard">Dashboard</a></li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section dashboard">
        <div class="row">

            <!-- Tổng số người dùng -->
            <div class="col-lg-3 col-md-6">
                <div class="card info-card">
                    <div class="card-body">
                        <h5 class="card-title">Người dùng</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle bg-primary text-white d-flex justify-content-center align-items-center"
                                 style="width: 48px; height: 48px;">
                                <i class="bi bi-people"></i>
                            </div>
                            <div class="ps-3">
                                <h6 id="userCount">0</h6>
                                <span class="text-muted small pt-1">Tổng tài khoản</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tổng số bài nghe -->
            <div class="col-lg-3 col-md-6">
                <div class="card info-card">
                    <a href="/view/admin/listening/list/1">
                        <div class="card-body">
                            <h5 class="card-title">Bài nghe</h5>
                            <div class="d-flex align-items-center">
                                <div class="card-icon rounded-circle bg-success text-white d-flex justify-content-center align-items-center"
                                     style="width: 48px; height: 48px;">
                                    <i class="bi bi-headphones"></i>
                                </div>
                                <div class="ps-3">
                                    <h6 id="listeningCount">0</h6>
                                    <span class="text-muted small pt-1">Đã thêm</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Tổng số bài viết -->
            <div class="col-lg-3 col-md-6">
                <div class="card info-card">
                    <a href="/view/admin/writing/list/1">
                        <div class="card-body">
                            <h5 class="card-title">Bài viết</h5>
                            <div class="d-flex align-items-center">
                                <div class="card-icon rounded-circle bg-warning text-white d-flex justify-content-center align-items-center"
                                     style="width: 48px; height: 48px;">
                                    <i class="bi bi-pencil-square"></i>
                                </div>
                                <div class="ps-3">
                                    <h6 id="writingCount">0</h6>
                                    <span class="text-muted small pt-1">Đã thêm</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Tổng số bài đọc -->
            <div class="col-lg-3 col-md-6">
                <div class="card info-card">
                    <div class="card-body">
                        <h5 class="card-title">Bài đọc</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle bg-danger text-white d-flex justify-content-center align-items-center"
                                 style="width: 48px; height: 48px;">
                                <i class="bi bi-book"></i>
                            </div>
                            <div class="ps-3">
                                <h6 id="readingCount">0</h6>
                                <span class="text-muted small pt-1">Đã thêm</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Biểu đồ hoạt động -->
        <div class="row">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Biểu đồ hoạt động (7 ngày)</h5>
                        <canvas id="activityChart" style="height: 300px;"></canvas>
                    </div>
                </div>
            </div>

            <!-- Người dùng mới đăng ký -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Người dùng mới</h5>
                        <ul class="list-group" style="max-height: 300px;">
                            <li class="list-group-item d-flex justify-content-between align-items-center" id="newUser">
                                <span id="newUserName">Nguyễn Văn A</span>
                                <span class="badge bg-primary" id="newUserCreateAt">12/06/2025</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Nội dung mới được thêm -->
        <div class="row">
            <div class="col-12">
                <div class="card recent-sales">
                    <div class="card-body">
                        <h5 class="card-title">Nội dung gần đây</h5>
                        <table class="table table-hover" id="latest">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Tiêu đề</th>
                                <th>Loại nội dung</th>
                                <th>Ngày tạo</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>1</td>
                                <td>Reading 1</td>
                                <td>Reading</td>
                                <td>16/06/2025</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main><!-- End #main -->

<th:block th:replace="~{partial/employee_footer :: employee_footer}"></th:block>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Script for chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    fetch('/api/dashboard/learning-activity', {
        headers: {
            "Authorization": localStorage.getItem("token")
        }
    })
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById("activityChart").getContext("2d");
            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: Array.from(data.labels),   // ["Mon", "Tue", ...]
                    datasets: [{
                        label: "Lượt học",
                        data: Array.from(data.data),    // [3, 5, 2, 0, 1, 7, 4]
                        backgroundColor: "#0d6efd"
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        })
        .catch(err => console.error("Lỗi biểu đồ lượt học:", err));
</script>



<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>

        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

<!-- JS for Dashboard Admin-->
<script src="/js/dashboard/admin-Dashboard.js"></script>


</body>

</html>
