<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Create Listening Lesson</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{partial/employee_header :: employee_header}"></th:block>
<th:block th:replace="~{partial/employee_sidebar :: employee_sidebar}"></th:block>

<main id="main" class="main">
    <div class="pagetitle">
        <h1>Listening</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item active"><a href="/view/admin/listening/list/1">List</a></li>
                <li class="breadcrumb-item active"><a href="/view/admin/listening/create">Create</a></li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <th:block th:replace="~{partial/notify :: notify}"></th:block>
    <th:block th:replace="~{partial/loading :: loading}"></th:block>

    <section class="section dashboard">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Create Listening Lesson</h5>

                <!-- Vertical Form -->
                <form id="createListeningForm" class="row g-3">
                    <div class="col-12">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" required>
                        <div class="invalid-feedback">Enter a valid title!</div>
                    </div>

                    <div class="col-12">
                        <label for="level" class="form-label">Level</label>
                        <select class="form-select" id="level" required>
                            <option value="1">Beginner</option>
                            <option value="2">Intermediate</option>
                            <option value="3">Advanced</option>
                        </select>
                        <div class="invalid-feedback">Please select a valid level!</div>
                    </div>

                    <!-- Radio chọn phương thức -->
                    <div class="col-12">
                        <label class="form-label">Audio Source</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sourceType" id="radioLink" value="link" checked>
                            <label class="form-check-label" for="radioLink">YouTube Link</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sourceType" id="radioAudio" value="audio">
                            <label class="form-check-label" for="radioAudio">Audio File</label>
                        </div>
                    </div>

                    <!-- Input cho YouTube link -->
                    <div class="col-12" id="linkInput">
                        <label for="link" class="form-label">YouTube Link</label>
                        <input type="text" class="form-control" id="link">
                        <div class="invalid-feedback">Enter a valid link!</div>
                    </div>

                    <!-- Input chọn file audio -->
                    <div class="col-12 d-none" id="audioInput">
                        <label for="audioFile" class="form-label">Upload Audio File</label>
                        <input type="file" class="form-control" id="audioFile" accept=".mp3,.wav,.m4a,.flac,.ogg,.webm,.aac">
                        <div class="invalid-feedback">Please choose an audio file!</div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
                <!-- Vertical Form -->

            </div>
        </div>
    </section>
</main><!-- End #main -->

<th:block th:replace="~{partial/employee_footer :: employee_footer}"></th:block>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Script for Create -->
<script th:src="@{/js/listening/create.js}"></script>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>

<!-- <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

</body>

</html>
