<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Register</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link href="/assets/vendor/quill/quill.snow.css" rel="stylesheet">
    <link href="/assets/vendor/quill/quill.bubble.css" rel="stylesheet">
    <link href="/assets/vendor/remixicon/remixicon.css" rel="stylesheet">
    <link href="/assets/vendor/simple-datatables/style.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<main>
    <div class="container">
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="register-container w-100" style="max-width: 900px;">

                <!-- Toast -->
                <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999">
                    <div id="toastNotification" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="d-flex">
                            <div id="toastMessage" class="toast-body"></div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                </div>

                <!-- Form Register -->
                <section class="section register py-4 px-3 px-md-5 bg-white shadow-lg rounded-4">
                    <div class="text-center mb-4">
                        <a href="/" class="logo d-flex align-items-center justify-content-center gap-2 mb-3">
                            <img src="/assets/img/logo.png" alt="Logo" style="height: 40px;">
                            <span class="fs-4 fw-bold text-primary">Tiếng Anh Mỗi Ngày</span>
                        </a>
                        <h5 class="fw-bold">Create an Account</h5>
                        <p class="text-muted small">Enter your personal details to create account</p>
                    </div>

                    <form class="row g-4 needs-validation" novalidate>
                        <!-- Cột trái -->
                        <div class="col-md-6">
                            <label for="yourName" class="form-label">Your Name</label>
                            <input type="text" name="name" class="form-control" id="yourName" required>
                            <div class="invalid-feedback">Enter your name!</div>

                            <label for="yourEmail" class="form-label mt-3">Your Email</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text">@</span>
                                <input type="text" name="email" class="form-control" id="yourEmail" required>
                                <div class="invalid-feedback">Enter a valid Email address!</div>
                            </div>

                            <label for="yourPhone" class="form-label mt-3">Your Phone</label>
                            <input type="text" name="phone" class="form-control" id="yourPhone" required>
                            <div class="invalid-feedback">Enter your phone!</div>

                            <label for="yourGender" class="form-label mt-3">Your Gender</label>
                            <select class="form-control" id="yourGender">
                                <option value="true">Male</option>
                                <option value="false">Female</option>
                            </select>

                            <label for="yourBirthday" class="form-label mt-3">Your Birthday</label>
                            <input type="date" class="form-control" id="yourBirthday">
                        </div>

                        <!-- Cột phải -->
                        <div class="col-md-6">
                            <label for="yourPassword" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="yourPassword" required>
                            <div class="invalid-feedback">Enter your password!</div>

                            <label for="yourConfirm-password" class="form-label mt-3">Confirm Password</label>
                            <input type="password" name="password" class="form-control" id="yourConfirm-password" required>
                            <div class="invalid-feedback">Enter your confirm password!</div>

                            <div class="form-check mt-4">
                                <input class="form-check-input" name="terms" type="checkbox" value="" id="acceptTerms" required>
                                <label class="form-check-label" for="acceptTerms">
                                    I agree and accept the <a href="#">terms and conditions</a>
                                </label>
                                <div class="invalid-feedback">You must agree before submitting.</div>
                            </div>

                            <div class="d-grid mt-4">
                                <button class="btn btn-primary" type="submit">Create Account</button>
                            </div>

                            <p class="small text-center mt-3 mb-0">
                                Already have an account? <a href="/view/auth/login">Log in</a>
                            </p>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>


<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Script for Register -->
<script th:src="@{/js/auth/register.js}"></script>
<script th:src="@{/js/notification.js}"></script>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/chart.js/chart.umd.js"></script>
<script src="/assets/vendor/echarts/echarts.min.js"></script>
<script src="/assets/vendor/quill/quill.js"></script>
<script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
<script src="/assets/vendor/tinymce/tinymce.min.js"></script>
<script src="/assets/vendor/php-email-form/validate.js"></script>

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

</body>

</html>
