<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Login</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
    <link href="/assets/vendor/quill/quill.snow.css" rel="stylesheet">
    <link href="/assets/vendor/quill/quill.bubble.css" rel="stylesheet">
    <link href="/assets/vendor/remixicon/remixicon.css" rel="stylesheet">
    <link href="/assets/vendor/simple-datatables/style.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<main>
    <div class="container">
        <th:block th:replace="~{partial/notify :: notify}"></th:block>

        <section class="section register min-vh-100 d-flex align-items-center justify-content-center py-5" style="background-color: #f5f7fa;">
            <div class="col-lg-5 col-md-8 col-sm-12">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body px-4 py-5">

                        <!-- Logo + Tiêu đề -->
                        <div class="text-center mb-4">
                            <a href="/" class="logo d-flex align-items-center justify-content-center gap-2 mb-2">
                                <img src="/assets/img/logo.png" alt="Logo" style="height: 40px;">
                                <span class="fs-4 fw-bold text-primary">Tiếng Anh Mỗi Ngày</span>
                            </a>
                            <h5 class="card-title fw-bold mb-1">Login to Your Account</h5>
                            <p class="text-muted small">Enter your username & password to login</p>
                        </div>

                        <!-- Form -->
                        <form class="row g-3 needs-validation" novalidate>
                            <!-- Email -->
                            <div class="col-12">
                                <label for="yourEmail" class="form-label">Email</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text" id="inputGroupPrepend">@</span>
                                    <input type="text" name="email" class="form-control" id="yourEmail" required>
                                    <div class="invalid-feedback">Please enter your email.</div>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-12">
                                <label for="yourPassword" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" id="yourPassword" required>
                                <div class="invalid-feedback">Please enter your password!</div>
                            </div>

                            <!-- Remember me -->
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="remember" value="true" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                            </div>

                            <!-- Button -->
                            <div class="col-12">
                                <button class="btn btn-primary w-100" type="submit">Login</button>
                            </div>

                            <!-- Chuyển hướng -->
                            <div class="col-12 text-center">
                                <p class="small mb-0">Don't have an account? <a href="/view/auth/register">Create an account</a></p>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </div>
</main>


<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Script for login -->
<script th:src="@{/js/auth/login.js}"></script>
<script th:src="@{/js/notification.js}"></script>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/chart.js/chart.umd.js"></script>
<script src="/assets/vendor/echarts/echarts.min.js"></script>
<script src="/assets/vendor/quill/quill.js"></script>
<script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
<script src="/assets/vendor/tinymce/tinymce.min.js"></script>
<script src="/assets/vendor/php-email-form/validate.js"></script>

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

</body>

</html>
