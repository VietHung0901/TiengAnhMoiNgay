    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const currentPath = window.location.pathname;

            // Tìm tất cả các <a> trong sidebar
            const navLinks = document.querySelectorAll("#sidebar-nav a");

            navLinks.forEach(link => {
                const linkPath = link.getAttribute("href");

                if (linkPath && currentPath.startsWith(linkPath)) {
                    // Thêm class active
                    link.classList.add("active");

                    // Nếu là link con (ví dụ Listening → Create)
                    const parentCollapse = link.closest(".collapse");
                    if (parentCollapse) {
                        parentCollapse.classList.add("show");

                        // Gỡ collapsed ở <a> cấp cha (menu toggle)
                        const parentLink = parentCollapse.previousElementSibling;
                        if (parentLink && parentLink.classList.contains("nav-link")) {
                            parentLink.classList.remove("collapsed");
                            parentLink.classList.add("active");
                        }
                    }
                }
            });
        });
    </script>
