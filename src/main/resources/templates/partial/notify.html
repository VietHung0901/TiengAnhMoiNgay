<div th:fragment="notify" class="position-fixed end-0 p-3" style="top: 50px; z-index: 9999">
    <div id="toastNotification" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div id="toastMessage" class="toast-body">
                <!-- Nội dung sẽ được JS chèn vào -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>
