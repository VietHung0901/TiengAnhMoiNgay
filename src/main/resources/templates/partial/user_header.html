<!-- ======= Header ======= -->
<header th:fragment="user_header" id="header" class="header fixed-top d-flex align-items-center">

    <div class="d-flex align-items-center justify-content-between">
        <a href="/view/user/home" class="logo d-flex align-items-center">
            <img src="/assets/img/logo.png" alt="">
            <span class="d-none d-lg-block">Tiếng Anh Mỗi Ngày</span>
        </a>
        <i class="bi bi-list toggle-sidebar-btn"></i>
    </div><!-- End Logo -->

    <div class="search-bar">
        <div class="search-form d-flex align-items-center">
            <input type="text" id="word-input" name="query" placeholder="Look up vocabulary" title="Enter search keyword">
            <button type="submit" id="search-button" title="Search"><i class="bi bi-search"></i></button>
        </div>
    </div><!-- End Search Bar -->

    <nav class="header-nav ms-auto">
        <ul class="d-flex align-items-center">

            <li class="nav-item d-block d-lg-none">
                <a class="nav-link nav-icon search-bar-toggle " href="#">
                    <i class="bi bi-search"></i>
                </a>
            </li><!-- End Search Icon-->

            <li class="nav-item dropdown pe-3">

                <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
                    <img src="/assets/img/profile-img.jpg" alt="Profile" class="rounded-circle">
                    <span class="d-none d-md-block dropdown-toggle ps-2" id="Name1" >Undefine</span>
                </a><!-- End Profile Iamge Icon -->

                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
                    <li class="dropdown-header">
                        <h6 id="Name">Undefine</h6>
                        <span id="Role">Undefine</span>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item d-flex align-items-center" href="#">
                            <i class="bi bi-person"></i>
                            <span>My Profile</span>
                        </a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item d-flex align-items-center" href="#">
                            <i class="bi bi-gear"></i>
                            <span>Account Settings</span>
                        </a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a class="dropdown-item d-flex align-items-center" href="#">
                            <i class="bi bi-question-circle"></i>
                            <span>Need Help?</span>
                        </a>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a id="btnLogout" class="dropdown-item d-flex align-items-center" href="">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Sign Out</span>
                        </a>
                    </li>

                </ul><!-- End Profile Dropdown Items -->
            </li><!-- End Profile Nav -->

        </ul>
    </nav><!-- End Icons Navigation -->
    <script th:src="@{/js/auth/logout.js}"></script>
    <script th:src="@{/js/handleApiResponse.js}"></script>
    <script th:src="@{/js/notification.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const name = localStorage.getItem("name");
            const role = localStorage.getItem("role");
            if (name) {
                document.getElementById("Name").textContent = name;
                document.getElementById("Name1").textContent = name;
            }
            if (role) {
                document.getElementById("Role").textContent = role;
            }
        });
    </script>
    <script>
        // Gắn sự kiện click cho nút tìm kiếm
        document.getElementById("search-button").addEventListener("click", function () {
            const word = document.getElementById("word-input").value.trim();
            if (word) {
                window.location.href = "/view/user/dictionary/search?query=" + encodeURIComponent(word);
            } else {
                alert("Vui lòng nhập từ cần tra cứu.");
            }
        });

        // Gắn sự kiện nhấn Enter trong ô input
        document.getElementById("word-input").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                const word = e.target.value.trim();
                if (word) {
                    window.location.href = "/view/user/dictionary/search?query=" + encodeURIComponent(word);
                } else {
                    alert("Vui lòng nhập từ cần tra cứu.");
                }
            }
        });
    </script><!-- End JS for Search -->
</header><!-- End Header -->
