<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Detail Reading Lesson</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="/assets/img/favicon.png" rel="icon">
  <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
        rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">


  <!-- Template Main CSS File -->
  <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{partial/user_header :: user_header}"></th:block>
<th:block th:replace="~{partial/user_sidebar :: user_sidebar}"></th:block>

<main id="main" class="main">
  <div class="pagetitle">
    <h1>Reading</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item active"><a href="/view/user/reading/list/1">List</a></li>
        <li class="breadcrumb-item active"><a id="detail-breadcrumb" href="#">Detail</a></li>
      </ol>
    </nav>
  </div><!-- End Page Title -->

  <th:block th:replace="~{partial/notify :: notify}"></th:block>
  <th:block th:replace="~{partial/loading :: loading}"></th:block>
  <th:block th:replace="~{partial/error :: error}"></th:block>

  <section class="reading container-fluid" style="background-color: #f8f9fa;">
    <div class="row shadow rounded-3 overflow-hidden" style="height: 85vh;">

      <!-- Bài đọc -->
      <div class="col-md-6 d-flex flex-column p-0" style="height: 100%;">
        <div class="p-4 d-flex flex-column h-100" style="background-color: #ffffff;">
          <h5 id="title" class="fw-semibold text-primary mb-3">
            📖 Đoạn Văn
          </h5>
          <div id="preview" class="flex-grow-1" style="font-size: 1.05rem; line-height: 1.8; overflow-y: auto; padding-right: 10px;">
            <!-- Nội dung bài reading từ file Word -->
          </div>
        </div>
      </div>

      <!-- Câu hỏi -->
      <div class="col-md-6 d-flex flex-column p-4 bg-light" style="height: 100%;">

        <h5 class="fw-semibold text-success mb-3">
          🧠 Trắc Nghiệm
        </h5>

        <div class="flex-grow-1 overflow-auto" style="max-height: 100%;">
          <form id="reading-quiz" class="d-flex flex-column h-100">

            <!-- Vùng chứa các câu hỏi (sẽ được render bằng JS) -->
            <div id="question-container" class="flex-grow-1">
              <!-- Các câu hỏi sẽ được chèn vào đây bằng JS -->
            </div>

            <!-- Nút nộp -->
            <div class="d-flex justify-content-end pt-3 border-top">
              <button type="submit" class="btn btn-success px-4 mt-2">
                ✅ Nộp bài
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main><!-- End #main -->

<th:block th:replace="~{partial/user_footer :: user_footer}"></th:block>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Script for Listen -->
<script type="module" th:src="@{/js/reading/detail-Load.js}"></script>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>

<!-- <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

<!-- Preview file word-->
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
</body>

</html>
