                <p class="text-muted">Hãy tiếp tục hành trình học tiếng Anh của bạn hôm nay.</p>

            <div class="row g-4">

                <div class="col-md-4">
                    <a href="/view/user/listening/list/1" class="text-decoration-none">
                        <div class="card card-hover h-100 shadow-sm border-0">
                            <div class="card-body text-center">
                                <i class="bi bi-headphones fs-1 text-success"></i>
                                <h5 class="mt-3">Luyện Nghe</h5>
                                <p class="text-muted">Luyện nghe với video và podcast chất lượng cao.</p>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Writing -->
                <div class="col-md-4">
                    <a href="/view/user/writing/list/1" class="text-decoration-none">
                        <div class="card card-hover h-100 shadow-sm border-0">
                            <div class="card-body text-center">
                                <i class="bi bi-pencil-square fs-1 text-warning"></i>
                                <h5 class="mt-3">Luyện Viết</h5>
                                <p class="text-muted">Viết bài luận và nhận góp ý từ AI.</p>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Thống kê -->
                <div class="col-md-4">
                    <a href="/view/user/reading/list/1" class="text-decoration-none">
                        <div class="card card-hover h-100 shadow-sm border-0">
                            <div class="card-body text-center">
                                <i class="bi bi-book fs-1 text-danger"></i>
                                <h5 class="mt-3">Luyện Đọc</h5>
                                <p class="text-muted">Theo dõi tiến độ học mỗi ngày của bạn.</p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Tiếp tục học -->
            <div class="mt-5">
                <h4 class="mb-3">Bài học gần đây</h4>
                <ul class="list-group" id="recentLessons">
                    <!-- Dữ liệu sẽ được gán bằng JavaScript -->
                </ul>
            </div>
        </div>
    </section>

</main><!-- End #main -->
