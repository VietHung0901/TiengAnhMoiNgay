<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Translate</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    <!-- Favicons -->
    <link href="/assets/img/favicon.png" rel="icon">
    <link href="/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Template Main CSS File -->
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>

<th:block th:replace="~{partial/user_header :: user_header}"></th:block>
<th:block th:replace="~{partial/user_sidebar :: user_sidebar}"></th:block>

<main id="main" class="main">

    <th:block th:replace="~{partial/notify :: notify}"></th:block>
    <th:block th:replace="~{partial/loading :: loading}"></th:block>

    <section class="section translate" id="translate-section">
        <div class="container">
            <h4 class="mb-3">Translate Vocabulary</h4>
            <div class="row">
                <!-- Khung nhập -->
                <div class="col-md-6">
                    <label for="sourceText" class="form-label">Source Text</label>
                    <textarea id="sourceText" class="form-control" rows="6" placeholder="Enter text to translate..."></textarea>
                </div>

                <!-- Khung kết quả -->
                <div class="col-md-6">
                    <label for="resultText" class="form-label">Translated Text</label>
                    <textarea id="resultText" class="form-control bg-light" rows="6" readonly></textarea>
                </div>
            </div>

            <!-- Tuỳ chọn ngôn ngữ và nút dịch -->
            <div class="row mt-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label">From:</label>
                    <select id="sourceLang" class="form-select">
                        <option value="en">English</option>
                        <option value="vi">Vietnamese</option>
                    </select>
                </div>
                <div class="col-md-1 text-center">
                    <button id="swapLangs" class="btn btn-outline-secondary mt-4" title="Swap languages">⇄</button>
                </div>
                <div class="col-md-4">
                    <label class="form-label">To:</label>
                    <select id="targetLang" class="form-select">
                        <option value="vi">Vietnamese</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="col-md-3 text-end mt-4">
                    <button id="translateButton" class="btn btn-primary">Translate</button>
                </div>
            </div>
        </div>
    </section>
</main><!-- End #main -->

<th:block th:replace="~{partial/user_footer :: user_footer}"></th:block>

<a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i
        class="bi bi-arrow-up-short"></i></a>

<!-- Vendor JS Files -->
<script src="/assets/vendor/apexcharts/apexcharts.min.js"></script>

<!-- <script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script> -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>

<!-- JS File For Search -->
<script src="/js/dictionary/translate.js"></script>
</body>

</html>
