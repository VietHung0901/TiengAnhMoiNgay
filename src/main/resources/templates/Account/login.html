<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{login.title}">Login Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Arial', sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 450px;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-top: 50px;
    }
    .login-container h3 {
      color: #4CAF50;
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
    .form-control:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
    }
    .btn-primary {
      background-color: #4CAF50;
      border: none;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .footer-text {
      text-align: center;
      font-size: 14px;
      color: #777;
    }
    .footer-text a {
      text-decoration: none;
      color: #4CAF50;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
    .form-group {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div th:replace="~{Header/User_header.html :: header}"></div>
<div class="container d-flex justify-content-center">
  <div class="login-container">
    <h3 th:text="#{login.heading}">Login</h3>
    <form>
      <div class="form-group">
        <label for="email" class="form-label" th:text="#{login.email}">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password" class="form-label" th:text="#{login.password}">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password">
      </div>
      <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label" for="remember" th:text="#{login.rememberMe}">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100" th:text="#{login.loginButton}">Login</button>
    </form>
    <p class="footer-text mt-3">
      <a href="#" th:text="#{login.forgotPassword}">Forgot your password?</a>
    </p>
    <p class="footer-text">
      <span th:text="#{login.noAccount}">Don't have an account?</span>
      <a href="/auth/register" th:text="#{login.register}">Sign up</a>
    </p>
  </div>
</div>
<input type="hidden" id="baseUrl" th:value="${baseUrl}">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chèn giá trị baseUrl vào JavaScript -->
<script>
  const baseUrl = document.getElementById("baseUrl").value;
  console.log(baseUrl); // Kiểm tra giá trị trong console
</script>


<script th:src="@{/js/Login.js}"></script>
</body>
</html>
