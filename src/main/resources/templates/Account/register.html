<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{register.title}">Register Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Arial', sans-serif;
    }
    .register-container {
      width: 100%;
      max-width: 450px;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-top: 50px;
    }
    .register-container h3 {
      color: #4CAF50;
      font-size: 28px;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
      color: #333;
    }
    .form-control:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
    }
    .btn-success {
      background-color: #4CAF50;
      border: none;
    }
    .btn-success:hover {
      background-color: #45a049;
    }
    .footer-text {
      text-align: center;
      font-size: 14px;
      color: #777;
    }
    .footer-text a {
      text-decoration: none;
      color: #4CAF50;
    }
    .footer-text a:hover {
      text-decoration: underline;
    }
    .form-group {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div th:replace="~{Header/User_header.html :: header}"></div>
<div class="container d-flex justify-content-center">
  <div class="register-container">
    <h3 th:text="#{register.heading}">Register</h3>
    <form>
      <div class="form-group">
        <label for="name" class="form-label" th:text="#{register.fullname}">Full name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="email" class="form-label" th:text="#{register.email}">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="phone" class="form-label" th:text="#{register.phone}">Phone</label>
        <input type="text" class="form-control" id="phone" placeholder="Enter your phone">
      </div>
      <div class="form-group">
        <label for="gender" class="form-label" th:text="#{register.gender}">Gender</label>
        <select class="form-control" id="gender">
          <option value="male" th:text="#{register.genderMale}">Male</option>
          <option value="female" th:text="#{register.genderFemale}">Female</option>
          <option value="other" th:text="#{register.genderOther}">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="birthday" class="form-label" th:text="#{register.birthday}">Birthday</label>
        <input type="date" class="form-control" id="birthday">
      </div>
      <div class="form-group">
        <label for="password" class="form-label" th:text="#{register.password}">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password">
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label" th:text="#{register.confirmPassword}">Confirm Password</label>
        <input type="password" class="form-control" id="confirm-password" placeholder="Confirm your password">
      </div>
      <button type="submit" class="btn btn-success w-100" th:text="#{register.registerButton}">Register</button>
    </form>
    <p class="footer-text mt-3">
      <span th:text="#{register.alreadyHaveAccount}">Already have an account?</span>
      <a href="/auth/login" th:text="#{register.login}">Login</a>
    </p>
  </div>
</div>
<input type="hidden" id="baseUrl" th:value="${baseUrl}">
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const baseUrl = document.getElementById("baseUrl").value;
  console.log(baseUrl); // Kiểm tra giá trị trong console
</script>
<script th:src="@{/js/Register.js}"></script>
</body>
</html>
